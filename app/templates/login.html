<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicRequest - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/static/favicon-32.png">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            margin: 0;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: var(--shadow-hover);
            animation: cardFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .icon-container {
            margin: 0 auto 1.5rem;
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .icon-container svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
        }

        .app-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .app-subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .input-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .passcode-input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem;
            font-size: 1.4rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: 0.45rem;
            outline: none;
            transition: var(--transition);
        }

        .passcode-input:focus {
            border-color: var(--text-primary);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
        }

        .passcode-input::placeholder {
            color: var(--text-muted);
            letter-spacing: normal;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transform: translateY(-2px);
            display: inline-block;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: var(--radius-md);
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .error-message {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 1rem;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .shake {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="login-card" id="login-card">
        <div class="icon-container">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1 class="app-title">MusicRequest</h1>
        <p class="app-subtitle">Authenticate to access</p>
        
        <form id="login-form">
            <div class="input-group">
                <input type="password" id="passcode-input" class="passcode-input" placeholder="Enter Passcode" autocomplete="off" autofocus>
            </div>
            <button type="submit" class="btn-submit">Unlock</button>
            <div id="error-message" class="error-message">Invalid passcode</div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const input = document.getElementById('passcode-input');
            const errorMessage = document.getElementById('error-message');
            const card = document.getElementById('login-card');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const passcode = input.value;
                if (!passcode) return;

                try {
                    const response = await fetch('/api/auth', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ passcode })
                    });

                    if (response.ok) {
                        window.location.reload();
                    } else {
                        showError();
                    }
                } catch (err) {
                    showError();
                }
            });

            function showError() {
                errorMessage.style.opacity = '1';
                card.classList.remove('shake');
                void card.offsetWidth; // trigger reflow
                card.classList.add('shake');
                input.value = '';
                input.focus();
                
                setTimeout(() => {
                    card.classList.remove('shake');
                }, 400);
            }

            input.addEventListener('input', () => {
                errorMessage.style.opacity = '0';
            });
        });
    </script>
</body>
</html>
